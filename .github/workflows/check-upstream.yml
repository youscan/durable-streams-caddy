name: check-upstream

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-plugin-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find latest upstream plugin tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/durable-streams/durable-streams/tags --paginate \
            --jq '.[].name' \
            | grep '^caddy-v' \
            | sort -V \
            | tail -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare with current pin
        id: compare
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source versions.env
          echo "current=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PLUGIN_VERSION" != "${{ steps.upstream.outputs.latest }}" && -n "${{ steps.upstream.outputs.latest }}" ]]; then
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue
        if: steps.compare.outputs.should_bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "chore: bump plugin to ${{ steps.upstream.outputs.latest }}"
          LATEST: ${{ steps.upstream.outputs.latest }}
          CURRENT: ${{ steps.compare.outputs.current }}
        run: |
          set -euo pipefail

          # Skip if an open issue for this exact version already exists.
          existing=$(gh issue list --state open --limit 200 --json title,number \
            --jq 'map(select(.title==env.TITLE)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open for $LATEST; skipping."
            exit 0
          fi

          body=$(cat <<EOF
          Upstream cut a new plugin release: \`$LATEST\`.

          - Current pin: \`$CURRENT\`
          - Latest upstream: \`$LATEST\`

          Bump \`PLUGIN_VERSION\` in \`versions.env\` and open a PR. CI will run
          the conformance suite (pinned at \`CONFORMANCE_VERSION\` in
          \`versions.env\`) against the bumped plugin. If it fails — typically
          because the new plugin release implements features tested in a newer
          conformance suite (e.g. forking, sliding TTL, added in conformance
          ≥ 0.3.0) — also bump \`CONFORMANCE_VERSION\` in \`versions.env\` and
          the matching dep in \`tests/package.json\`.
          EOF
          )

          gh issue create --title "$TITLE" --body "$body"
